<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化合物搜索</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }
        button[type="submit"]:hover:not(:disabled) {
            background: #45a049;
        }
        button[type="submit"]:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .search-tips {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #6c757d;
        }
        .search-tips p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #4CAF50;
            font-size: 16px;
            margin-top: 10px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .error-container {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            color: #856404;
        }
        .error-container.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .error-container.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error-title {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .error-message {
            margin-bottom: 10px;
        }
        .retry-button {
            background: #007bff;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .retry-button:hover {
            background: #0056b3;
        }
        .close-button {
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .close-button:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>化合物搜索</h1>
        <p class="description">搜索毒理学数据库中的化合物</p>
    </div>

    <div class="navbar">
        <div class="navbar-right">
            <a href="/" class="right">主页</a>
            <a href="#" class="right active">搜索</a>
            <a href="/toxicity_search" class="right">毒性特征筛选</a>
            <a href="/toxicity_prediction" class="right">毒性预测</a>
            <a href="/data_collection" class="right">数据收集</a>
        </div>
    </div>

    <div class="main-content">
        <div class="section">
            <h2>搜索化合物</h2>
            <div class="search-container">
                <form action="/search_result" method="GET" id="searchForm">
                    <div style="margin-bottom: 20px;">
                        <label for="search_field" style="display: block; margin-bottom: 10px; font-size: 18px;">选择搜索字段：</label>
                        <select name="search_field" id="search_field" style="width: 100%; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;">
                            <option value="ID">ID</option>
                            <option value="Name">Name</option>
                            <option value="IUPAC_Name">IUPAC_Name</option>
                            <option value="PubChem_CID">PubChem_CID</option>
                            <option value="Canonical_SMILES">Canonical_SMILES</option>
                            <option value="InChIKey">InChIKey</option>
                        </select>
                    </div>
                    <input type="text" name="keyword" id="keyword" placeholder="输入搜索关键词..." required minlength="1" maxlength="500">
                    <div id="error-message" style="color: #d32f2f; margin-top: 10px; display: none;"></div>
                    <button type="submit" id="searchButton">搜索</button>
                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner"></div>
                        <div class="loading-text">正在搜索化合物数据...</div>
                    </div>
                    <div class="error-container" id="errorContainer">
                        <div class="error-title" id="errorTitle">提示</div>
                        <div class="error-message" id="errorMessage"></div>
                        <button type="button" class="retry-button" id="retryButton" style="display: none;">重试</button>
                        <button type="button" class="close-button" id="closeButton">关闭</button>
                    </div>
                </form>
                
                <div class="search-tips">
                    <p>提示：含有特殊符号(如[]-)的化合物名称可能查询失败，建议使用PubChem_CID进行精确查询</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showLoading() {
            const searchButton = document.getElementById('searchButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorContainer = document.getElementById('errorContainer');
            
            searchButton.style.display = 'none';
            loadingSpinner.style.display = 'block';
            loadingSpinner.classList.add('fade-in');
            errorContainer.style.display = 'none';
        }
        
        function hideLoading() {
            const searchButton = document.getElementById('searchButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            loadingSpinner.style.display = 'none';
            searchButton.style.display = 'block';
            searchButton.disabled = false;
            searchButton.textContent = '搜索';
        }
        
        function showError(message, type = 'error', showRetry = false) {
            const errorContainer = document.getElementById('errorContainer');
            const errorTitle = document.getElementById('errorTitle');
            const errorMessage = document.getElementById('errorMessage');
            const retryButton = document.getElementById('retryButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const searchButton = document.getElementById('searchButton');
            
            // 隐藏加载状态
            loadingSpinner.style.display = 'none';
            searchButton.style.display = 'block';
            
            // 设置错误类型样式
            errorContainer.className = 'error-container';
            if (type) {
                errorContainer.classList.add(type);
            }
            
            // 设置标题和消息
            errorTitle.textContent = type === 'error' ? '错误' : 
                                   type === 'success' ? '成功' : '提示';
            errorMessage.textContent = message;
            
            // 显示重试按钮
            retryButton.style.display = showRetry ? 'inline-block' : 'none';
            
            // 显示错误容器
            errorContainer.style.display = 'block';
            errorContainer.classList.add('fade-in');
        }
        
        function hideError() {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.style.display = 'none';
        }
        
        function handleNetworkError() {
            showError('网络连接失败，请检查网络后重试', 'error', true);
        }
        
        function handleServerError() {
            showError('服务器响应错误，请稍后重试', 'error', true);
        }
        
        function handleTimeoutError() {
            showError('请求超时，请稍后重试', 'error', true);
        }
        
        function handleNotFoundError() {
            showError('未找到匹配的化合物，请尝试其他关键词', 'error', false);
        }
        
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            const keyword = document.getElementById('keyword').value.trim();
            const searchField = document.getElementById('search_field').value;
            const errorMessage = document.getElementById('error-message');
            
            // 清除之前的错误信息
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
            
            // 验证空值
            if (!keyword || keyword.length === 0) {
                e.preventDefault();
                errorMessage.textContent = '请输入搜索关键词';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 验证长度
            if (keyword.length < 1 || keyword.length > 500) {
                e.preventDefault();
                errorMessage.textContent = '搜索关键词长度应在1-500个字符之间';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 根据搜索字段类型进行特定验证
            if (searchField === 'ID' || searchField === 'PubChem_CID') {
                // 验证是否为数字
                if (!/^\d+$/.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'ID和PubChem_CID必须为数字';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            if (searchField === 'Canonical_SMILES') {
                // 验证SMILES格式（基本验证）
                if (!/^[A-Za-z0-9@+\-[\]\/=\(\)\.#%]+$/.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'SMILES格式包含非法字符';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            if (searchField === 'InChIKey') {
                // 验证InChIKey格式（27个字符，以InChIKey=开头或标准格式）
                const inchikeyPattern = /^([A-Z]{14}-[A-Z]{10}-[A-Z])$/;
                if (!inchikeyPattern.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'InChIKey格式应为：XXXXXXXXXXXXXX-XXXXXXXXXX-X';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            // 验证特殊字符
            const dangerousChars = /[<>"'%;()&+]/;
            if (dangerousChars.test(keyword)) {
                e.preventDefault();
                errorMessage.textContent = '搜索关键词包含非法字符';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 显示加载状态
            showLoading();
        });
        
        // 实时验证
        document.getElementById('keyword').addEventListener('input', function() {
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
        });
        
        // 键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // Enter键提交表单
            if (e.key === 'Enter' && (e.target.id === 'keyword' || e.target.id === 'search_field')) {
                e.preventDefault();
                // 先显示加载动画再提交
                const form = document.getElementById('searchForm');
                if (form.checkValidity()) {
                    showLoading();
                    form.submit();
                } else {
                    // 触发表单验证
                    form.reportValidity();
                }
            }
            
            // ESC键清空输入框
            if (e.key === 'Escape' && e.target.id === 'keyword') {
                e.preventDefault();
                document.getElementById('keyword').value = '';
                document.getElementById('keyword').focus();
                
                // 清除错误信息
                const errorMessage = document.getElementById('error-message');
                errorMessage.style.display = 'none';
                errorMessage.textContent = '';
                hideError();
            }
            
            // Ctrl/Cmd + K 聚焦搜索框
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('keyword').focus();
                document.getElementById('keyword').select();
            }
        });
        
        // 为搜索框添加占位符提示快捷键
        document.getElementById('keyword').addEventListener('focus', function() {
            this.placeholder = '输入搜索关键词... (按Enter搜索, ESC清空)';
        });
        
        document.getElementById('keyword').addEventListener('blur', function() {
            this.placeholder = '输入搜索关键词...';
        });
        
        // 页面加载完成后的处理
        window.addEventListener('load', function() {
            // 如果页面是从搜索结果返回，隐藏加载状态
            hideLoading();
        });
        
        // 处理浏览器返回按钮
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                hideLoading();
                hideError();
            }
        });
        
        // 错误处理相关事件监听
        document.getElementById('closeButton').addEventListener('click', function() {
            hideError();
        });
        
        document.getElementById('retryButton').addEventListener('click', function() {
            hideError();
            document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        });
        
        // 监听网络状态变化
        window.addEventListener('online', function() {
            showError('网络已恢复，可以继续搜索', 'success', false);
            setTimeout(hideError, 3000);
        });
        
        window.addEventListener('offline', function() {
            showError('网络已断开，请检查网络连接', 'error', false);
        });
        
        // 增强表单提交处理，添加超时和错误处理
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            const keyword = document.getElementById('keyword').value.trim();
            const searchField = document.getElementById('search_field').value;
            const errorMessage = document.getElementById('error-message');
            
            // 清除之前的错误信息
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
            hideError();
            
            // 验证空值
            if (!keyword || keyword.length === 0) {
                e.preventDefault();
                errorMessage.textContent = '请输入搜索关键词';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 验证长度
            if (keyword.length < 1 || keyword.length > 500) {
                e.preventDefault();
                errorMessage.textContent = '搜索关键词长度应在1-500个字符之间';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 根据搜索字段类型进行特定验证
            if (searchField === 'ID' || searchField === 'PubChem_CID') {
                if (!/^\d+$/.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'ID和PubChem_CID必须为数字';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            if (searchField === 'Canonical_SMILES') {
                if (!/^[A-Za-z0-9@+\-[\]\/=\(\)\.#%]+$/.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'SMILES格式包含非法字符';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            if (searchField === 'InChIKey') {
                const inchikeyPattern = /^([A-Z]{14}-[A-Z]{10}-[A-Z])$/;
                if (!inchikeyPattern.test(keyword)) {
                    e.preventDefault();
                    errorMessage.textContent = 'InChIKey格式应为：XXXXXXXXXXXXXX-XXXXXXXXXX-X';
                    errorMessage.style.display = 'block';
                    return false;
                }
            }
            
            // 验证特殊字符
            const dangerousChars = /[<>"'%;()&+]/;
            if (dangerousChars.test(keyword)) {
                e.preventDefault();
                errorMessage.textContent = '搜索关键词包含非法字符';
                errorMessage.style.display = 'block';
                return false;
            }
            
            // 检查网络连接
            if (!navigator.onLine) {
                e.preventDefault();
                handleNetworkError();
                return false;
            }
            
            // 显示加载状态
            showLoading();
            
            // 设置超时处理（30秒）
            setTimeout(function() {
                if (document.getElementById('loadingSpinner').style.display !== 'none') {
                    hideLoading();
                    handleTimeoutError();
                }
            }, 30000);
        });
    </script>
</body>
</html>
