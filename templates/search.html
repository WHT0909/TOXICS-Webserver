<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化合物搜索</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        button[type="submit"]:hover {
            background: #45a049;
        }
        .search-tips {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #6c757d;
        }
        .search-tips p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>化合物搜索</h1>
        <p class="description">搜索毒理学数据库中的化合物</p>
    </div>

    <div class="navbar">
        <div class="navbar-right">
            <a href="/" class="right">主页</a>
            <a href="#" class="right active">搜索</a>
            <a href="/toxicity_search" class="right">毒性特征筛选</a>
            <a href="/toxicity_prediction" class="right">毒性预测</a>
            <a href="/data_collection" class="right">数据收集</a>
        </div>
    </div>

    <div class="main-content">
        <div class="section">
            <h2>搜索化合物</h2>
            <div class="search-container">
                <form action="/search_result" method="GET">
                    <div style="margin-bottom: 20px;">
                        <label for="search_field" style="display: block; margin-bottom: 10px; font-size: 18px;">选择搜索字段：</label>
                        <select name="search_field" id="search_field" style="width: 100%; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;">
                            <option value="ID">ID</option>
                            <option value="Name">Name</option>
                            <option value="IUPAC_Name">IUPAC_Name</option>
                            <option value="PubChem_CID">PubChem_CID</option>
                            <option value="Canonical_SMILES">Canonical_SMILES</option>
                            <option value="InChIKey">InChIKey</option>
                        </select>
                    </div>
                    <input type="text" name="keyword" placeholder="输入搜索关键词..." required>
                    <button type="submit">搜索</button>
                </form>
                
                <div class="search-tips">
                    <p>提示：含有特殊符号(如[]-)的化合物名称可能查询失败，建议使用PubChem_CID进行精确查询</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
