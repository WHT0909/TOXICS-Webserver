<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毒性特征筛选</title>

    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);

        select {
            width: 100%;

            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;

        input[type="text"] {

            padding: 15px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        button[type="submit"]:hover {
            background: #45a049;
        }
        .search-tips {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #6c757d;
        }
        .search-tips p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;

        .hidden {

                <div class="search-tips">
                    <p>提示：输入关键词搜索或直接选择一个毒性特征来查看具有该特征的所有化合物。</p>
                </div>
                
                <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const searchInput = document.getElementById('search_keyword');
                    const selectElement = document.getElementById('toxicity_field');
                    
                    // 保存所有选项的原始数据
                    const allOptions = [];
                    Array.from(selectElement.options).forEach(option => {
                        allOptions.push({
                            value: option.value,
                            text: option.text
                        });
                    });
                    
                    searchInput.addEventListener('input', function() {
                        const searchTerm = this.value.toLowerCase();
                        
                        // 清空当前选项
                        selectElement.innerHTML = '';
                        
                        // 筛选并添加匹配的选项
                        const filteredOptions = searchTerm ? 
                            allOptions.filter(opt => 
                                opt.text.toLowerCase().includes(searchTerm) || 
                                opt.value.toLowerCase().includes(searchTerm)
                            ) : allOptions;
                        
                        // 如果没有匹配项，显示所有选项
                        const optionsToShow = filteredOptions.length > 0 ? filteredOptions : allOptions;
                        
                        // 重新添加选项到select元素
                        optionsToShow.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            option.text = opt.text;
                            selectElement.appendChild(option);
                        });
                        
                        // 如果有匹配项且搜索词不为空，自动选择第一个匹配项
                        if (filteredOptions.length > 0 && searchTerm) {
                            selectElement.selectedIndex = 0;
                        }
                    });
                });
                </script>
            </div>

</body>
</html>
